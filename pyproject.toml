[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussseed"
version = "0.1.0"
description = "Backend-aware learned initialization prior for monocular 3DGS SLAM"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "dacite",
  "einops",
  "hydra-core>=1.3",
  "jaxtyping",
  "numpy",
  "omegaconf",
  "Pillow",
  "scipy",
  "torch",
  "torchvision",
]

[project.scripts]
gaussseed-predict = "gaussseed.cli:main"
gaussseed-train = "transplat.src.main:train"

[tool.setuptools]
py-modules = ["model_wrapper"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gaussseed*", "gaussseed_encoder*", "transplat*"]

[tool.setuptools.package-data]
"transplat.config" = ["**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
