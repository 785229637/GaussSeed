name: "tum_rgbd"

defaults:
  - view_sampler: bounded

roots: 
  - "${oc.env:TUM_RGBD_ROOT,./data/TUM_RGBD}"
sequence: rgbd_dataset_freiburg1_desk
image_size: [480, 640]  # TUM-RGBD原始分辨率
image_shape: [256, 256]  # 模型输入尺寸
baseline_epsilon: 0.01
max_fov: 90.0
make_baseline_1: true
augment: false
test_len: 100
test_chunk_interval: 1
test_times_per_scene: 1
skip_bad_shape: true
near: 0.1  # 室内场景近平面
far: 10.0  # 室内场景远平面
baseline_scale_bounds: true
shuffle_val: false
max_time_diff: 0.02  # 图像和位姿的最大时间差(秒)
depth_scale: 5000.0
context_stride: 5
context_stride_jitter: 1
target_radius: 10
target_stride: 5


background_color: [0.0, 0.0, 0.0]
cameras_are_circular: false
