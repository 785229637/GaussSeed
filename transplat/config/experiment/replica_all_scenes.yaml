# @package _global_
# Post-training SLAM evaluation configuration; not used to train GaussSeed.

defaults:
  - override /dataset: replica
  - override /model/encoder: trans
  - override /loss: [mse, depth]

data_loader:
  train:
    batch_size: 1
    num_workers: 0
    persistent_workers: false
  val:
    num_workers: 0
    persistent_workers: false
  test:
    num_workers: 0
    persistent_workers: false

trainer:
  max_steps: 47856
  val_check_interval: 7976
  num_sanity_val_steps: 0

checkpointing:
  every_n_train_steps: 7976
  save_top_k: -1

optimizer:
  lr: 1.e-5
  warm_up_steps: 1000
  cosine_lr: true

train:
  print_log_every_n_steps: 100

model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1]
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]

dataset:
  image_shape: [256, 256]
  roots: ["${oc.env:REPLICA_ROOT,./data/Replica}"]
  sequences: [office0, office1, office2, office3, office4, room0, room1, room2]
  sequence: office0
  context_stride: 5
  context_stride_jitter: 1
  target_radius: 10
  target_stride: 5
  near: 0.1
  far: 10.0
  baseline_scale_bounds: true
  make_baseline_1: true

test:
  eval_time_skip_steps: 5
  compute_scores: true
