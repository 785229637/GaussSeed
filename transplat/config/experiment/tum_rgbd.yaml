# @package _global_
# Post-training SLAM evaluation configuration; not used to train GaussSeed.

defaults:
  - override /dataset: tum_rgbd  # 修改为tum_rgbd
  - override /model/encoder: trans
  - override /loss: [mse,pose]  # 室内场景可先不使用lpips
  # - override /loss: [pose]
#
data_loader:
  train:
    batch_size: 1  # 保持与re10k一致

trainer:
  max_steps: 20000  # 增加训练步数以适应新数据

model:
  encoder:
    num_depth_candidates: 128
    costvolume_unet_feat_dim: 128
    costvolume_unet_channel_mult: [1,1,1] 
    costvolume_unet_attn_res: [4]
    gaussians_per_pixel: 1
    depth_unet_feat_dim: 32
    depth_unet_attn_res: [16]
    depth_unet_channel_mult: [1,1,1,1,1]

dataset:
  image_shape: [256, 256]
  roots: ["${oc.env:TUM_RGBD_ROOT,./data/TUM_RGBD}"]
  near: 0.001  # 室内场景近平面
  far: 10.0  # 室内场景远平面
  baseline_scale_bounds: true  # 保持基线缩放
  make_baseline_1: true  # 标准化基线

test:
  eval_time_skip_steps: 5
  compute_scores: true
